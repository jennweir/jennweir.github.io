{{ define "main" }}
  {{ partial "header.html" . }}

  <div class="flex flex-row justify-between pt-8">
    <div class="flex flex-col w-full gap-4">
      <div class="flex flex-row gap-4">
        <p class="text-3xl max-sm:text-2xl">📁</p>
        <h1 class="text-3xl max-sm:text-2xl font-bold">Projects</h1>
      </div>
      <hr />
      {{ with .Pages }}
        <ul class="flex flex-col">
          {{ range . }}
            <a href="{{ .RelPermalink }}">
              <div class="flex flex-col border-l px-4 py-2 hover:text-lt-green">
                <h2 class="text-xl font-bold">{{ .LinkTitle }}</h2>
                {{ with .Params.description }}
                  <p class="text-sm text-slate-300">{{ . }}</p>
                {{ end }}
              </div>
            </a>
          {{ end }}
        </ul>
      {{ else }}
        <p>No projects yet.</p>
      {{ end }}
    </div>
  </div>

  {{ partial "footer_regular.html" . }}
{{ end }}
